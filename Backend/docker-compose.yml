services:
  database:
    image: postgres:18-alpine
    container_name: wordlist
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: wordlist
    ports:
      - 5432:5432
    volumes:
      - ./database/postgres:/var/lib/postgresql

  database_test:
    image: postgres:18-alpine
    container_name: wordlist_test
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: wordlist_test
    ports:
      - 5433:5432

volumes:
  database:
